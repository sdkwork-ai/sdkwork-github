# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/github/webserver.pid;
error_log /var/log/sdkwork/github/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:4100;
    }
    server {
        listen 80;
        server_name github-demo.sdkwork.com github-demo.birdcoder.com github-demo.dtupay.com github-demo.noaper.com github-demo.sdkwork.cn github-demo.birdcoder.cn github-demo.dtupay.cn github-demo.noaper.cn github-demo.skubc.com github-demo.skubc.cn github-demo.zowalk.com github-demo.zowalk.cn github-demo.offer86.com github-demo.offer86.cn github-demo.86offer.com github-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/github/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
