# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/github/webserver.pid;
error_log /var/log/sdkwork/github/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name github-staging.sdkwork.com github-staging.birdcoder.com github-staging.dtupay.com github-staging.sdkwork.cn github-staging.birdcoder.cn github-staging.dtupay.cn github-staging.skubc.com github-staging.skubc.cn github-staging.zowalk.com github-staging.zowalk.cn github-staging.offer86.com github-staging.offer86.cn github-staging.86offer.com github-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
